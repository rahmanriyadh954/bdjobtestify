<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ca" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b14" media="(prefers-color-scheme: dark)" />

    <!-- ═══ Primary SEO ═══ -->
    <title>BD JobTestify — Bangladesh Government Job Exam Preparation</title>
    <meta name="description" content="Prepare for BCS, Bank, NTRCA, Primary and other Bangladesh government job exams. Daily and weekly model tests, instant MCQ results, AI-marked written answers and detailed progress tracking." />
    <meta name="keywords" content="BCS preparation, bank job exam, NTRCA, primary teacher exam, Bangladesh government job, model test, MCQ practice, chakrir prostuti, job exam BD" />
    <meta name="author" content="BD JobTestify" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://bdjobtestify.com/" />

    <!-- ═══ Language ═══ -->
    <meta http-equiv="content-language" content="en, bn" />
    <link rel="alternate" hreflang="en" href="https://bdjobtestify.com/" />
    <link rel="alternate" hreflang="bn" href="https://bdjobtestify.com/" />
    <link rel="alternate" hreflang="x-default" href="https://bdjobtestify.com/" />

    <!-- ═══ Open Graph ═══ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BD JobTestify" />
    <meta property="og:title" content="BD JobTestify — Bangladesh Government Job Exam Preparation" />
    <meta property="og:description" content="Daily and weekly model tests for BCS, Bank, NTRCA and Primary exams. Instant results, AI-marked written answers and full progress tracking." />
    <meta property="og:url" content="https://bdjobtestify.com/" />
    <meta property="og:image" content="https://bdjobtestify.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BD JobTestify — government job exam preparation portal" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bn_BD" />

    <!-- ═══ Twitter ═══ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BD JobTestify — Government Job Exam Preparation" />
    <meta name="twitter:description" content="Daily and weekly model tests for BCS, Bank, NTRCA and Primary exams, with instant results and AI-marked written answers." />
    <meta name="twitter:image" content="https://bdjobtestify.com/og-image.png" />

    <!-- ═══ Icons & PWA ═══ -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BD JobTestify" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ═══ Performance ═══ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="format-detection" content="telephone=no" />

    <!-- ═══ Structured data ═══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "BD JobTestify",
      "alternateName": "BD JobTestify Exam Portal",
      "url": "https://bdjobtestify.com/",
      "description": "Online preparation portal for Bangladesh government job exams, offering daily and weekly model tests with instant results and AI-marked written answers.",
      "areaServed": { "@type": "Country", "name": "Bangladesh" },
      "inLanguage": ["en", "bn"],
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student",
        "audienceType": "Government job candidates in Bangladesh"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Exam preparation",
        "itemListElement": [
          { "@type": "Course", "name": "BCS Preliminary Model Tests", "description": "Practice model tests covering the full BCS preliminary syllabus.", "provider": { "@type": "Organization", "name": "BD JobTestify" } },
          { "@type": "Course", "name": "Bank Job Model Tests", "description": "Practice tests for Bangladesh bank recruitment exams.", "provider": { "@type": "Organization", "name": "BD JobTestify" } },
          { "@type": "Course", "name": "NTRCA & Primary Teacher Tests", "description": "Practice tests for teacher recruitment exams in Bangladesh.", "provider": { "@type": "Organization", "name": "BD JobTestify" } }
        ]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BD JobTestify",
      "url": "https://bdjobtestify.com/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "featureList": [
        "Daily and weekly model tests",
        "Instant MCQ results",
        "AI-marked written answers",
        "Subject-wise performance tracking",
        "Progress charts and exam history"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding:40px;font-family:system-ui,sans-serif;text-align:center">
        <h1>BD JobTestify</h1>
        <p>This exam portal needs JavaScript to run. Please enable JavaScript in your browser and reload the page.</p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
